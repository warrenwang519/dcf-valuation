<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DCF Valuation App — Logo Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 40px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 24px; color: #333; margin-bottom: 30px; text-align: center; }
    .variants { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
    .variant { text-align: center; }
    .variant h2 { font-size: 16px; color: #666; margin-bottom: 16px; }
    .logo-box { width: 200px; height: 200px; border-radius: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .logo-box.light { background: #FFFFFF; }
    .logo-box.dark { background: #1C1C1E; }
    .logo-box svg { width: 160px; height: 160px; }
    .sizes { display: flex; gap: 20px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
    .size-item { text-align: center; }
    .size-item p { font-size: 12px; color: #888; margin-top: 8px; }
    .size-box { border-radius: 22%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .size-box.light { background: #FFFFFF; }
    .size-box.dark { background: #1C1C1E; }
    .size-box svg { width: 80%; height: 80%; }
  </style>
</head>
<body>
  <div class="container">
    <h1>DCF Valuation App — Logo Preview</h1>

    <div class="variants">
      <div class="variant">
        <h2>Light Mode</h2>
        <div class="logo-box light">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
            <line x1="50" y1="40" x2="50" y2="270" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
            <path d="M-10,220 C50,220 90,100 150,100 C220,100 260,240 310,240
                     L310,300 C260,300 220,160 150,160 C90,160 50,280 -10,280 Z"
                  fill="#0A84FF"/>
          </svg>
        </div>
      </div>

      <div class="variant">
        <h2>Dark Mode</h2>
        <div class="logo-box dark">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
            <line x1="50" y1="40" x2="50" y2="270" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round"/>
            <path d="M-10,220 C50,220 90,100 150,100 C220,100 260,240 310,240
                     L310,300 C260,300 220,160 150,160 C90,160 50,280 -10,280 Z"
                  fill="#64B5F6"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="sizes">
      <div class="size-item">
        <div class="size-box light" style="width:120px;height:120px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
            <line x1="50" y1="40" x2="50" y2="270" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
            <path d="M-10,220 C50,220 90,100 150,100 C220,100 260,240 310,240
                     L310,300 C260,300 220,160 150,160 C90,160 50,280 -10,280 Z"
                  fill="#0A84FF"/>
          </svg>
        </div>
        <p>120×120 — Tab Icon</p>
      </div>
      <div class="size-item">
        <div class="size-box light" style="width:80px;height:80px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
            <line x1="50" y1="40" x2="50" y2="270" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
            <path d="M-10,220 C50,220 90,100 150,100 C220,100 260,240 310,240
                     L310,300 C260,300 220,160 150,160 C90,160 50,280 -10,280 Z"
                  fill="#0A84FF"/>
          </svg>
        </div>
        <p>80×80 — Settings</p>
      </div>
      <div class="size-item">
        <div class="size-box light" style="width:48px;height:48px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
            <line x1="50" y1="40" x2="50" y2="270" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
            <path d="M-10,220 C50,220 90,100 150,100 C220,100 260,240 310,240
                     L310,300 C260,300 220,160 150,160 C90,160 50,280 -10,280 Z"
                  fill="#0A84FF"/>
          </svg>
        </div>
        <p>48×48 — Notification</p>
      </div>
    </div>
  </div>
</body>
</html>
