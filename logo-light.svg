<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- DCF Valuation App Logo — Light Mode -->
  <!-- Flat, minimal, modern. No gradients. -->

  <!-- Wall: single vertical line, abstract -->
  <line x1="50" y1="40" x2="50" y2="270"
        stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>

  <!-- River: wide S-curve, bottom-left → top-right, single flat color -->
  <path d="M-10,220 C50,220 90,100 150,100 C220,100 260,240 310,240
           L310,300 C260,300 220,160 150,160 C90,160 50,280 -10,280 Z"
        fill="#0A84FF"/>
</svg>
